<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Fondo oscuro -->
  <rect width="800" height="500" fill="#15171e" />

  <!-- Borde del SoC (FPGA Consola) -->
  <rect x="50" y="50" width="550" height="400" fill="none" stroke="#8892b0" stroke-width="2" stroke-dasharray="10,5" />
  <text x="60" y="80" fill="#8892b0" font-family="sans-serif" font-size="18" font-weight="bold">SoC (Dentro de la FPGA Consola)</text>

  <!-- Bus del Sistema -->
  <rect x="250" y="100" width="40" height="300" fill="#2d3246" stroke="#a6accd" stroke-width="2" />
  <text x="-340" y="275" fill="#a6accd" font-family="sans-serif" font-size="16" font-weight="bold" transform="rotate(-90)">Bus de Sistema Interno (ej. Wishbone / AXI)</text>

  <!-- CPU Core -->
  <rect x="80" y="200" width="120" height="100" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="5" />
  <text x="140" y="245" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">FemtoRV32</text>
  <text x="140" y="265" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">(CPU Core)</text>
  <!-- Conexión CPU a Bus -->
  <path d="M 200 240 L 250 240" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)" />
  <path d="M 250 260 L 200 260" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue-rev)" />

  <!-- Controladores IP internos -->
  
  <!-- UART RX -->
  <rect x="350" y="100" width="160" height="50" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="5" />
  <text x="430" y="130" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Controlador UART RX</text>
  <path d="M 290 125 L 350 125" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)" />
  <path d="M 350 115 L 290 115" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green-rev)" />

  <!-- Memoria (Flash/RAM) -->
  <rect x="350" y="170" width="160" height="50" fill="#1e293b" stroke="#fbbf24" stroke-width="2" rx="5" />
  <text x="430" y="200" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Controlador Memoria</text>
  <path d="M 290 195 L 350 195" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-yellow)" />
  <path d="M 350 185 L 290 185" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-yellow-rev)" />

  <!-- Pantalla LED -->
  <rect x="350" y="240" width="160" height="50" fill="#1e293b" stroke="#f87171" stroke-width="2" rx="5" />
  <text x="430" y="270" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Driver Pantalla 64x64</text>
  <path d="M 290 265 L 350 265" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <path d="M 350 255 L 290 255" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red-rev)" />

  <!-- Audio -->
  <rect x="350" y="310" width="160" height="50" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="5" />
  <text x="430" y="340" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Generador de Sonido</text>
  <path d="M 290 335 L 350 335" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <path d="M 350 325 L 290 325" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple-rev)" />

  <!-- Config -->
  <rect x="350" y="380" width="160" height="50" fill="#1e293b" stroke="#a3e635" stroke-width="2" rx="5" />
  <text x="430" y="410" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Módulo CONFIG</text>
  <path d="M 290 405 L 350 405" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow-lime)" />
  <path d="M 350 395 L 290 395" stroke="#a3e635" stroke-width="2" marker-end="url(#arrow-lime-rev)" />

  <!-- Interfaces Físicas Externas (Pines FPGA) -->
  <text x="630" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12">Pines RX (Hacia ESP32)</text>
  <line x1="510" y1="125" x2="620" y2="125" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,2" />

  <text x="630" y="200" fill="#94a3b8" font-family="sans-serif" font-size="12">Buses SPI/Paralelo (Flash/RAM)</text>
  <line x1="510" y1="195" x2="620" y2="195" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2" />

  <text x="630" y="270" fill="#94a3b8" font-family="sans-serif" font-size="12">Pines HUB75 / Datos (Panel LED)</text>
  <line x1="510" y1="265" x2="620" y2="265" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2" />

  <text x="630" y="340" fill="#94a3b8" font-family="sans-serif" font-size="12">Pin PWM / I2S (Sonido)</text>
  <line x1="510" y1="335" x2="620" y2="335" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,2" />

  <!-- Definición de flechas -->
  <defs>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" /></marker>
    <marker id="arrow-blue-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#38bdf8" /></marker>
    
    <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#4ade80" /></marker>
    <marker id="arrow-green-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#4ade80" /></marker>
    
    <marker id="arrow-yellow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#fbbf24" /></marker>
    <marker id="arrow-yellow-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#fbbf24" /></marker>
    
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#f87171" /></marker>
    <marker id="arrow-red-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#f87171" /></marker>
    
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#c084fc" /></marker>
    <marker id="arrow-purple-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#c084fc" /></marker>

    <marker id="arrow-lime" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#a3e635" /></marker>
    <marker id="arrow-lime-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto"><path d="M6,0 L6,6 L0,3 z" fill="#a3e635" /></marker>
  </defs>
</svg>
