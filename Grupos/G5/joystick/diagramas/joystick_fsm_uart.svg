<text x="640" y="566" font-size="17" fill="#203d4d" font-weight="bold">REPOSO</text>
<text x="30" y="648" font-size="15" fill="#203d4d" font-weight="normal">rst → REPOSO desde cualquier estado. Entre instantes de muestreo se conserva el estado.</text>
