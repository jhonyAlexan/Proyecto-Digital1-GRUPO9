<text x="820" y="402" class="footer" text-anchor="middle">A → A: el flujo continúa en la fila inferior, de izquierda a derecha.</text>
<rect x="92" y="720" width="1454" height="82" rx="10" fill="#f7f9fb" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="118" y="752" class="group" text-anchor="start">Idea principal</text>
<text x="118" y="780" class="note" text-anchor="start">La ESP32 digitaliza y organiza las lecturas; la FPGA recibe y valida; el femtoRV32 consulta los registros para controlar el juego.</text>
<text x="92" y="833" class="footer" text-anchor="start">Estado del proyecto: lectura inicial de X/Y/botón disponible; transmisión estructurada y receptor MMIO pendientes de implementación y prueba.</text>
