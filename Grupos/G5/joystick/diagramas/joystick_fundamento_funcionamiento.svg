<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="870" viewBox="0 0 1640 870" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Principio de funcionamiento del periférico joystick, Grupo 5</title>
<desc id="fig-desc">Diagrama conceptual de diez etapas: movimiento del usuario, joystick analógico, variación de tensión, adquisición en ESP32, empaquetado, comunicación UART, recepción en FPGA, registros MMIO, procesador femtoRV32 y control del videojuego. La lectura de la ESP32 ya tiene programa inicial; el resto del enlace corresponde a la propuesta de diseño.</desc>
