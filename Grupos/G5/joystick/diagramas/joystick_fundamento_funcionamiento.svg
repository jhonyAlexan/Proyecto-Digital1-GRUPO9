.sub {font-size:18px; fill:#475569;}
.group {font-size:17px; font-weight:700; fill:#475569; letter-spacing:0.8px;}
.num {font-size:15px; font-weight:700; fill:#ffffff;}
.nodeTitle {font-size:23px; font-weight:700; fill:#162338;}
.nodeSub {font-size:17px; fill:#445467;}
.connector {font-size:17px; font-weight:700; fill:#ffffff;}
